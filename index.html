<!doctype html>
<html lang="pt-BR">
<head>
  <!-- Define a codificação, o ajuste para telas móveis e o título da página. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf4ff">
  <title>Meu Kanban</title>
  <style>
    /* Variáveis de cores e estilos globais usados em todo o quadro. */
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #eaf4ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #788399;
      --line: #e8ecf3;
      --accent: #000000;
      --shadow: 0 8px 24px rgb(34 45 70 / 7%);
    }

    /* Faz largura e altura incluírem bordas e espaçamentos. */
    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    /* Centraliza o conteúdo e organiza o cabeçalho do quadro. */
    .app { width: min(1200px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: .75rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.4rem); letter-spacing: -.045em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: .96rem; }

    /* Estilo compartilhado dos botões principais. */
    .primary-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px;
      color: var(--accent); background: #dcecff; box-shadow: var(--shadow);
      font-weight: 700; transition: transform .15s, background .15s;
    }
    .primary-button:hover { background: #cfe3fb; transform: translateY(-1px); }
    #open-modal { background: #b8d7f7; }
    #open-modal:hover { background: #a7cdf3; }
    .plus { font-size: 1.3rem; line-height: 1; }

    /* Mostra as três colunas lado a lado em telas maiores. */
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 20px; }
    .column { min-width: 0; padding: 17px; border: 1px solid #a7cdf3; border-radius: 17px; background: #b8d7f7; }
    .column-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 16px; }
    .column-title { display: flex; align-items: center; gap: 9px; margin: 0; font-size: .98rem; font-weight: 750; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #909aae; }
    [data-status="doing"] .dot { background: #e5a331; }
    [data-status="done"] .dot { background: #36a779; }
    .task-count { display: grid; min-width: 25px; height: 25px; padding: 0 7px; place-items: center; border-radius: 8px; color: #657087; background: #e1e6ef; font-size: .77rem; font-weight: 700; }
    .task-list { display: grid; min-height: 115px; gap: 12px; align-content: start; border-radius: 11px; transition: background .15s, outline-color .15s; }
    .task-list.drag-over { outline: 2px dashed #9a93f0; outline-offset: 5px; background: rgb(98 88 232 / 5%); }

    /* Cartões de tarefa e indicação visual durante o arraste. */
    .task-card { position: relative; padding: 16px 15px 14px; border: 1px solid #d5e5f7; border-radius: 13px; background: #dcecff; box-shadow: var(--shadow); cursor: grab; }
    .task-card:active { cursor: grabbing; }
    .task-card.dragging { opacity: .45; }
    .task-card h3 { margin: 0 26px 8px 0; overflow-wrap: anywhere; font-size: .96rem; line-height: 1.4; }
    .task-card p { margin: 0; color: var(--muted); font-size: .86rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .delete-button { position: absolute; top: 10px; right: 10px; display: grid; width: 30px; height: 30px; place-items: center; border: 0; border-radius: 8px; color: #9aa3b3; background: transparent; font-size: 1.2rem; }
    .delete-button:hover { color: #c64055; background: #fff0f2; }
    .empty { margin: 0; padding: 18px 10px; border: 1px dashed #d6dce7; border-radius: 12px; color: #9099aa; text-align: center; font-size: .84rem; }

    /* Mensagem de erro de armazenamento e aparência do modal. */
    .storage-notice { min-height: 1.3em; margin: 18px 0 0; color: #b54747; font-size: .84rem; }
    .modal-backdrop { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 20px; background: rgb(22 29 47 / 45%); }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(100%, 460px); padding: 25px; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px rgb(15 23 42 / 25%); }
    .modal h2 { margin: 0 0 6px; font-size: 1.35rem; letter-spacing: -.025em; }
    .modal-intro { margin: 0 0 22px; color: var(--muted); font-size: .9rem; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field label { font-size: .86rem; font-weight: 700; }
    .field input, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid #dfe4ed; border-radius: 10px; outline: none; background: #fff; }
    .field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(98 88 232 / 13%); }
    .field textarea { min-height: 105px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 21px; }
    .secondary-button { min-height: 43px; padding: 0 15px; border: 1px solid var(--line); border-radius: 10px; color: #455066; background: #fff; font-weight: 650; }
    .secondary-button:hover { background: #f7f8fb; }
    .modal .primary-button { min-height: 43px; }

    /* Em telas menores, empilha as colunas e adapta o cabeçalho. */
    @media (max-width: 760px) {
      .app { width: min(100% - 32px, 560px); padding-top: 30px; }
      .topbar { align-items: flex-start; flex-direction: column; margin-bottom: 25px; }
      .topbar .primary-button { width: 100%; }
      .board { grid-template-columns: 1fr; gap: 14px; }
      .column { padding: 15px; }
      .task-list { min-height: 88px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- Cabeçalho do quadro e botão para criar uma tarefa. -->
    <header class="topbar">
      <div>
        <p class="eyebrow">Organize seu trabalho</p>
        <h1>Meu Kanban</h1>
        <p class="subtitle">Acompanhe suas tarefas do começo ao fim.</p>
      </div>
      <button class="primary-button" id="open-modal" type="button">
        <span class="plus" aria-hidden="true">+</span> Adicionar nova tarefa
      </button>
    </header>

    <!-- Cada coluna tem um status usado pelo JavaScript para organizar os cartões. -->
    <section class="board" aria-label="Quadro de tarefas">
      <section class="column" data-status="todo" aria-labelledby="title-todo">
        <header class="column-header">
          <h2 class="column-title" id="title-todo"><span class="dot" aria-hidden="true"></span>A Fazer</h2>
          <span class="task-count" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-status="todo" aria-label="Tarefas a fazer"></div>
      </section>
      <section class="column" data-status="doing" aria-labelledby="title-doing">
        <header class="column-header">
          <h2 class="column-title" id="title-doing"><span class="dot" aria-hidden="true"></span>Em Andamento</h2>
          <span class="task-count" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-status="doing" aria-label="Tarefas em andamento"></div>
      </section>
      <section class="column" data-status="done" aria-labelledby="title-done">
        <header class="column-header">
          <h2 class="column-title" id="title-done"><span class="dot" aria-hidden="true"></span>Concluído</h2>
          <span class="task-count" aria-label="0 tarefas">0</span>
        </header>
        <div class="task-list" data-status="done" aria-label="Tarefas concluídas"></div>
      </section>
    </section>
    <p class="storage-notice" id="storage-notice" role="status" aria-live="polite"></p>
  </main>

  <!-- Janela inicialmente oculta para preencher os dados da nova tarefa. -->
  <div class="modal-backdrop" id="task-modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description">
      <h2 id="modal-title">Nova tarefa</h2>
      <p class="modal-intro" id="modal-description">Adicione uma tarefa à coluna “A Fazer”.</p>
      <form id="task-form">
        <div class="field">
          <label for="task-title">Título</label>
          <input id="task-title" name="title" type="text" maxlength="120" required autocomplete="off" placeholder="Ex.: Preparar apresentação">
        </div>
        <div class="field">
          <label for="task-description">Descrição <span style="font-weight: 400; color: #788399">(opcional)</span></label>
          <textarea id="task-description" name="description" maxlength="1000" placeholder="Escreva alguns detalhes..."></textarea>
        </div>
        <div class="modal-actions">
          <button class="secondary-button" id="cancel-modal" type="button">Cancelar</button>
          <button class="primary-button" type="submit">Adicionar tarefa</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    (() => {
      // Chave do localStorage, status permitidos e referências aos elementos da página.
      const STORAGE_KEY = "meu-kanban-tarefas-v1";
      const statuses = ["todo", "doing", "done"];
      const lists = Array.from(document.querySelectorAll(".task-list"));
      const modal = document.getElementById("task-modal");
      const form = document.getElementById("task-form");
      const titleInput = document.getElementById("task-title");
      const descriptionInput = document.getElementById("task-description");
      const openModalButton = document.getElementById("open-modal");
      const cancelModalButton = document.getElementById("cancel-modal");
      const storageNotice = document.getElementById("storage-notice");
      let draggedTaskId = null;
      let tasks = loadTasks();

      // Recupera as tarefas salvas e confere se os dados têm o formato esperado.
      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Os dados salvos não estão no formato esperado.");
          return parsed.filter((task) =>
            task &&
            typeof task.id === "string" &&
            typeof task.title === "string" &&
            typeof task.description === "string" &&
            statuses.includes(task.status)
          );
        } catch (error) {
          storageNotice.textContent = "Não foi possível carregar as tarefas salvas. Os dados podem estar corrompidos.";
          console.error("Erro ao carregar tarefas do Kanban:", error);
          return [];
        }
      }

      // Salva a lista atual no navegador e mostra uma mensagem se ocorrer um erro.
      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          storageNotice.textContent = "";
        } catch (error) {
          storageNotice.textContent = "Não foi possível salvar as alterações. Verifique o espaço disponível no navegador.";
          console.error("Erro ao salvar tarefas do Kanban:", error);
        }
      }

      // Atualiza as três colunas, incluindo cartões, botões de exclusão e contadores.
      function render() {
        for (const list of lists) {
          const status = list.dataset.status;
          const statusTasks = tasks.filter((task) => task.status === status);
          list.replaceChildren();

          // Exibe uma orientação quando a coluna ainda não tem cartões.
          if (statusTasks.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty";
            empty.textContent = "Arraste uma tarefa para cá";
            list.append(empty);
          }

          // Cria os elementos do cartão usando texto seguro, sem interpretar HTML digitado.
          for (const task of statusTasks) {
            const card = document.createElement("article");
            card.className = "task-card";
            card.draggable = true;
            card.dataset.taskId = task.id;

            const title = document.createElement("h3");
            title.textContent = task.title;
            card.append(title);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.type = "button";
            deleteButton.setAttribute("aria-label", `Excluir tarefa: ${task.title}`);
            deleteButton.title = "Excluir tarefa";
            deleteButton.textContent = "×";
            // Ao excluir, atualiza os dados salvos e redesenha as colunas.
            deleteButton.addEventListener("click", () => {
              tasks = tasks.filter((item) => item.id !== task.id);
              saveTasks();
              render();
            });
            card.append(deleteButton);

            if (task.description) {
              const description = document.createElement("p");
              description.textContent = task.description;
              card.append(description);
            }

            // Guarda o identificador do cartão para movê-lo com o recurso nativo de arraste.
            card.addEventListener("dragstart", (event) => {
              draggedTaskId = task.id;
              card.classList.add("dragging");
              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", task.id);
            });
            // Limpa os estilos temporários quando o arraste termina.
            card.addEventListener("dragend", () => {
              draggedTaskId = null;
              card.classList.remove("dragging");
              lists.forEach((item) => item.classList.remove("drag-over"));
            });
            list.append(card);
          }

          const count = list.closest(".column").querySelector(".task-count");
          count.textContent = String(statusTasks.length);
          count.setAttribute("aria-label", `${statusTasks.length} ${statusTasks.length === 1 ? "tarefa" : "tarefas"}`);
        }
      }

      // Abre o formulário e posiciona o cursor no campo do título.
      function openModal() {
        modal.hidden = false;
        titleInput.focus();
      }

      // Fecha o formulário, limpa os campos e devolve o foco ao botão de abertura.
      function closeModal() {
        modal.hidden = true;
        form.reset();
        openModalButton.focus();
      }

      // Permite fechar o modal pelo botão, clicando fora dele ou pressionando Esc.
      openModalButton.addEventListener("click", openModal);
      cancelModalButton.addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) closeModal();
      });

      // Valida o título, cria a tarefa na coluna "A Fazer" e persiste a alteração.
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = titleInput.value.trim();
        if (!title) {
          titleInput.focus();
          return;
        }
        tasks.unshift({
          // Usa um identificador único mesmo em navegadores sem randomUUID.
          id: window.crypto && typeof window.crypto.randomUUID === "function"
            ? window.crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          title,
          description: descriptionInput.value.trim(),
          status: "todo"
        });
        saveTasks();
        render();
        closeModal();
      });

      // Habilita o arraste sobre cada coluna e altera o status ao soltar um cartão.
      lists.forEach((list) => {
        list.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "move";
          list.classList.add("drag-over");
        });
        list.addEventListener("dragleave", (event) => {
          if (!list.contains(event.relatedTarget)) list.classList.remove("drag-over");
        });
        list.addEventListener("drop", (event) => {
          event.preventDefault();
          list.classList.remove("drag-over");
          const taskId = event.dataTransfer.getData("text/plain") || draggedTaskId;
          const task = tasks.find((item) => item.id === taskId);
          if (!task || !statuses.includes(list.dataset.status)) return;
          task.status = list.dataset.status;
          saveTasks();
          // Desenha o quadro com as tarefas carregadas ao abrir a página.
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
