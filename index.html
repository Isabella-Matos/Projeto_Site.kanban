<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro Kanban</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ PÁGINA INICIAL ============ -->
<section class="auth" id="viewHome">
  <div class="auth-card">
    <h1>Quadro Kanban</h1>
    <p class="subtitle">Organize suas tarefas em A Fazer, Em Andamento e Concluído.</p>
    <button class="btn-primary" data-go="login">Entrar</button>
    <button class="btn-ghost" data-go="signup">Criar conta</button>
  </div>
</section>

<!-- ============ TELA: ENTRAR ============ -->
<section class="auth" id="viewLogin" hidden>
  <div class="auth-card">
    <h1>Entrar</h1>
    <p class="subtitle">Acesse seu quadro de tarefas.</p>
    <form id="loginForm" novalidate>
      <label for="loginEmail">E-mail ou nome de usuário</label>
      <input id="loginEmail" type="text" autocomplete="username" placeholder="voce@exemplo.com" required>
      <label for="loginPass">Senha</label>
      <div class="pw">
        <input id="loginPass" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" data-toggle="loginPass" aria-label="Mostrar senha">Mostrar</button>
      </div>
      <p class="error" id="loginError" role="alert"></p>
      <button class="btn-primary" type="submit">Entrar</button>
    </form>
    <p class="switch">Ainda não tem conta? <button class="link" data-go="signup">Criar conta</button></p>
    <p class="switch"><button class="link" data-go="home">Voltar à página inicial</button></p>
  </div>
</section>

<!-- ============ TELA 2: CRIAR CONTA ============ -->
<section class="auth" id="viewSignup" hidden>
  <div class="auth-card">
    <h1>Criar conta</h1>
    <p class="subtitle">Leva menos de um minuto.</p>
    <form id="signupForm" novalidate>
      <label for="signName">Nome</label>
      <input id="signName" type="text" autocomplete="name" maxlength="60" placeholder="Seu nome" required>
      <label for="signEmail">E-mail</label>
      <input id="signEmail" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
      <label for="signPass">Senha</label>
      <div class="pw">
        <input id="signPass" type="password" autocomplete="new-password" minlength="6" placeholder="Mínimo de 6 caracteres" required>
        <button type="button" class="toggle" data-toggle="signPass" aria-label="Mostrar senha">Mostrar</button>
      </div>
      <p class="error" id="signupError" role="alert"></p>
      <button class="btn-primary" type="submit">Criar conta</button>
    </form>
    <p class="switch">Já tem uma conta? <button class="link" data-go="login">Entrar</button></p>
    <p class="switch"><button class="link" data-go="home">Voltar à página inicial</button></p>
  </div>
</section>

<!-- ============ TELA 3: QUADRO KANBAN ============ -->
<div id="viewApp" hidden>
  <header>
    <div>
      <h1>Quadro Kanban</h1>
      <p class="subtitle">Arraste os cards entre as colunas.</p>
    </div>
    <div class="header-actions">
      <span class="user" id="userName"></span>
      <button class="btn-primary" id="openModal">+ Adicionar nova tarefa</button>
      <button class="btn-ghost" id="logout">Sair</button>
    </div>
  </header>
  <main class="board" id="board"></main>
</div>

<!-- Modal de nova tarefa -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Nova tarefa</h2>
    <form id="taskForm">
      <label for="title">Título</label>
      <input id="title" maxlength="80" required placeholder="Ex.: Revisar proposta do cliente">
      <label for="desc">Descrição</label>
      <textarea id="desc" maxlength="400" placeholder="Detalhes da atividade (opcional)"></textarea>
      <div class="actions">
        <button type="button" class="btn-ghost" id="cancel">Cancelar</button>
        <button type="submit" class="btn-primary">Salvar tarefa</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="script.js"></script>
</body>
</html>
